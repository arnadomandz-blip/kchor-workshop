<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Workshop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --navy:#12151f;
  --navy2:#252c40;
  --paper:#eef2ee;
  --line:#3a4260;
  --cyan:#7fe0d6;
  --coral:#ff9d81;
  --amber:#f0b860;
  --ink:#161c28;
  --ink-soft:#dbe2ea;
  --muted:#8b96ab;
  --danger:#ff8a80;
  --radius:14px;
}
[data-theme="light"]{
  --navy:#f2ece2;
  --navy2:#ffffff;
  --paper:#101826;
  --ink:#fbf7f2;
  --ink-soft:#2c3446;
  --line:#e7ddd0;
  --muted:#8a8577;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--navy);
  color:var(--ink-soft);
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:28px 28px;
  background-attachment:fixed;
  transition:background .2s,color .2s;
}
[data-theme="light"] body{ color:#16202e; background-image:
    linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px); }
a{color:inherit;}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  background:var(--navy2);
  border-right:1px solid var(--line);
  padding:20px 14px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:4px;
}
.brand{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:18px;padding:0 8px;
}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius);cursor:pointer;
  font-size:13.5px;color:var(--ink-soft);border-left:2px solid transparent;
}
.nav-item:hover{background:rgba(95,212,214,.08);}
.nav-item.active{background:rgba(95,212,214,.12);border-left:2px solid var(--cyan);color:var(--cyan);}
.nav-num{font-size:15px;width:20px;text-align:center;}
.sidebar-foot{margin-top:auto;padding:10px 8px;font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;border-top:1px solid var(--line);}

/* MAIN */
.main{padding:26px 34px 60px;max-width:1080px;}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
.search{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 12px;
}
.search input{background:none;border:none;outline:none;color:var(--ink-soft);font-family:'Inter';font-size:13px;width:100%;}
.icon-btn{
  background:var(--navy2);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;cursor:pointer;color:var(--ink-soft);font-size:13px;font-family:'Inter';
}
.icon-btn:hover{border-color:var(--coral);color:var(--coral);}

.hamburger{display:none;}
.sidebar-backdrop{display:none;}
@media(max-width:820px){
  .app{grid-template-columns:1fr;}
  .sidebar{
    position:fixed;top:0;left:-250px;width:220px;height:100vh;z-index:60;
    transition:left .25s ease;box-shadow:4px 0 24px rgba(0,0,0,.35);
  }
  .sidebar.open{left:0;}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;
  }
  .sidebar-backdrop.show{display:block;}
  .hamburger{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;background:var(--navy2);border:1px solid var(--line);
    border-radius:999px;cursor:pointer;font-size:16px;flex-shrink:0;
  }
  .main{padding:16px 16px 70px;}
  .topbar{flex-wrap:wrap;gap:10px;}
  .search{order:3;flex-basis:100%;}
  h1.page-title{font-size:19px;}
}

.memory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.memory-card{background:var(--navy);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;}
.memory-card img{width:100%;height:140px;object-fit:cover;display:block;}
.memory-card .cap{padding:8px 10px;font-size:12px;color:var(--ink-soft);}
.memory-card .cap .muted{font-size:10.5px;}
.memory-card .x-btn{position:absolute;top:6px;right:6px;background:rgba(20,20,20,.55);border-radius:50%;width:24px;height:24px;color:#fff;}
.upload-drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;}
.upload-drop:hover{border-color:var(--coral);color:var(--coral);}
.save-toast{position:fixed;bottom:18px;right:18px;background:var(--cyan);color:#0d1a1a;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;}
.save-toast.show{opacity:1;}

.nav-group-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px;}
.nav-item{position:relative;}
.nav-badge{background:var(--danger);color:#2a1210;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:auto;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,128,.55);}70%{box-shadow:0 0 0 7px rgba(255,138,128,0);}100%{box-shadow:0 0 0 0 rgba(255,138,128,0);}}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;flex-shrink:0;animation:pulse 1.5s infinite;}
.list-item{transition:transform .12s,box-shadow .12s;border-left:3px solid transparent;}
.list-item:hover{transform:translateX(2px);}
.list-item.urgent-overdue{border-left-color:var(--danger);background:linear-gradient(90deg, rgba(255,138,128,.09), transparent 60%);}
.list-item.urgent-soon{border-left-color:var(--amber);background:linear-gradient(90deg, rgba(240,184,96,.09), transparent 60%);}
.panel, .memory-card, .note-card{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.stat .num{transition:color .2s;}
.stat.warn .num{color:var(--danger);}

h1.page-title{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;
  color:var(--ink-soft);margin:0 0 4px;letter-spacing:-.01em;
}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 26px;}

.panel{
  background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.14);
}
.panel-title{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
@media(max-width:800px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.stat{display:flex;flex-direction:column;gap:2px;}
.stat .num{font-family:'JetBrains Mono';font-size:26px;color:var(--cyan);}
.stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

input,textarea,select{
  background:var(--navy);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-soft);font-family:'Inter';font-size:13px;padding:8px 10px;width:100%;
}
textarea{resize:vertical;font-family:'JetBrains Mono';}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}
.btn{
  background:var(--coral);color:#241512;border:none;border-radius:999px;
  padding:9px 18px;font-family:'Inter';font-size:12.5px;font-weight:600;cursor:pointer;
  letter-spacing:.01em;transition:transform .12s,filter .12s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn.secondary{background:none;border:1px solid var(--line);color:var(--ink-soft);}
.btn.danger{background:var(--danger);color:#2a1210;}
.row{display:flex;gap:10px;flex-wrap:wrap;}

.list-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;
  background:var(--navy);
}
.tag{font-family:'JetBrains Mono';font-size:10px;padding:2px 7px;border:1px solid var(--line);border-radius:12px;color:var(--muted);}
.tag.cyan{color:var(--cyan);border-color:var(--cyan);}
.tag.amber{color:var(--amber);border-color:var(--amber);}
.tag.danger{color:var(--danger);border-color:var(--danger);}
.muted{color:var(--muted);font-size:12px;}
.x-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}
.x-btn:hover{color:var(--danger);}

.note-card{background:var(--navy);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;}
.note-card:hover{border-color:var(--cyan);}
.note-card h4{margin:0 0 6px;font-size:14px;font-family:'JetBrains Mono';}
.note-card p{margin:0;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:60px;overflow:hidden;}

.md-preview h1,.md-preview h2,.md-preview h3{color:var(--cyan);font-family:'JetBrains Mono';}
.md-preview code{background:var(--navy);padding:1px 5px;border-radius:2px;font-family:'JetBrains Mono';}
.md-preview{font-size:13.5px;line-height:1.6;}

.hidden{display:none !important;}
.calc-result{font-family:'JetBrains Mono';font-size:20px;color:var(--cyan);margin-top:10px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">Workshop<small>your study corner</small></div>
    <div id="nav"></div>
    <div class="sidebar-foot">JetBrains / Inter<br>synced to this browser</div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn">&#9776;</button>
      <div class="search"><span>&#128269;</span><input id="globalSearch" placeholder="Search subjects, notes, formulas, bookmarks..."></div>
      <button class="icon-btn" id="themeToggle">&#9789; theme</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="save-toast" id="saveToast">Saved ✓</div>

<script>
// ---------- IN-MEMORY STATE ----------
let state = {

    {id:5,category:'Mechanics',name:'Torsion (shear stress)',formula:'τ = T·r / J',examples:[

      'E=200 GPa, I=0.00002 m⁴, K=2, L=4 m → P_cr ≈ 6.17×10⁵ N',

    {id:8,category:'Mechanics',name:'Moment of Inertia (rectangle)',formula:'I = b·h³ / 12',examples:[

    {id:9,category:'Calculus',name:'Taylor Series',formula:'f(x) = Σ fⁿ(a)/n! · (x−a)ⁿ',examples:[

// ---------- URGENCY ----------
function daysUntil(due){
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(due+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function urgencyOf(a){
  if(a.done) return 'done';
  const diff=daysUntil(a.due);
  if(diff<0) return 'overdue';
  if(diff<=2) return 'soon';
  return 'ok';
}
function urgentCount(){
  return state.assignments.filter(a=>!a.done && ['overdue','soon'].includes(urgencyOf(a))).length;
}

function subjName(id){ const s=state.subjects.find(s=>s.id===id); return s?s.name:'—'; }
function subjColor(id){ const s=state.subjects.find(s=>s.id===id); return s?s.color:'#7a8a99'; }
function uid(key){ return state.nextId[key]++; }
function go(page){ state.page=page; render(); if(typeof closeSidebar==='function') closeSidebar(); }

function renderNav(){
  const badge = urgentCount();
  document.getElementById('nav').innerHTML = nav.map(g=>`
    <div class="nav-group-label">${g.group}</div>
    ${g.items.map(n=>`
      <div class="nav-item ${state.page===n.id?'active':''}" onclick="go('${n.id}')">
        <span class="nav-num">${n.icon}</span>${n.label}
        ${(n.id==='tracker' && badge>0) ? `<span class="nav-badge">${badge}</span>` : ''}
      </div>`).join('')}
  `).join('');
}

// ---------- simple markdown ----------
function md(src){
  return src
    .replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.*?)\*/g,'<i>$1</i>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/^- (.*)$/gm,'<li>$1</li>')
    .replace(/^\d\. (.*)$/gm,'<li>$1</li>')
    .replace(/\n\n/g,'<br><br>');
}

const lengthToM = {m:1,ft:0.3048,in:0.0254,mm:0.001,cm:0.01,km:1000,mi:1609.344};
function calcUnit(){
  const val=parseFloat(document.getElementById('uc_val').value)||0;
  const from=document.getElementById('uc_from').value, to=document.getElementById('uc_to').value;
  const meters=val*lengthToM[from];
  const result=meters/lengthToM[to];
  document.getElementById('uc_result').textContent = `${val} ${from} = ${result.toFixed(5)} ${to}`;
}
const mfpUnits = {
  mass:{kg:1, g:0.001, lb:0.453592, oz:0.0283495, ton:1000},
  force:{N:1, kN:1000, lbf:4.44822, kgf:9.80665},
  pressure:{Pa:1, kPa:1000, MPa:1000000, bar:100000, psi:6894.76, atm:101325},
};
function fillMFPSelects(){
  const cat=document.getElementById('mfp_cat').value;
  const units=Object.keys(mfpUnits[cat]);
  document.getElementById('mfp_from').innerHTML = units.map(u=>`<option>${u}</option>`).join('');
  document.getElementById('mfp_to').innerHTML = units.map(u=>`<option>${u}</option>`).join('');
  document.getElementById('mfp_to').selectedIndex = Math.min(1, units.length-1);
}
function calcMFP(){
  if(!document.getElementById('mfp_from').options.length) fillMFPSelects();
  const cat=document.getElementById('mfp_cat').value;
  const val=parseFloat(document.getElementById('mfp_val').value)||0;
  const from=document.getElementById('mfp_from').value, to=document.getElementById('mfp_to').value;
  if(!from||!to){ fillMFPSelects(); return; }
  const base=val*mfpUnits[cat][from];
  const result=base/mfpUnits[cat][to];
  document.getElementById('mfp_result').textContent = `${val} ${from} = ${result.toFixed(5)} ${to}`;
}
function calcAV(){
  const w=parseFloat(document.getElementById('av_w').value)||0;
  const h=parseFloat(document.getElementById('av_h').value)||0;
  const d=parseFloat(document.getElementById('av_d').value);
  const area=w*h;
  let txt=`Area: ${area.toFixed(4)} m²`;
  if(d){ txt+=` · Volume: ${(area*d).toFixed(4)} m³`; }
  document.getElementById('av_result').textContent=txt;
}
function calcCircle(){
  const r=parseFloat(document.getElementById('circ_r').value)||0;
  const h=parseFloat(document.getElementById('circ_h').value);
  const area=Math.PI*r*r;
  const circ=2*Math.PI*r;
  let txt=`Area: ${area.toFixed(4)} m² · Circumference: ${circ.toFixed(4)} m`;
  if(h){ txt+=` · Volume: ${(area*h).toFixed(4)} m³`; }
  document.getElementById('circ_result').textContent=txt;
}
function calcOhm(changed){
  const vEl=document.getElementById('ohm_v'), iEl=document.getElementById('ohm_i'), rEl=document.getElementById('ohm_r');
  let v=parseFloat(vEl.value), i=parseFloat(iEl.value), r=parseFloat(rEl.value);
  const out=document.getElementById('ohm_result');
  if(changed!=='r' && !isNaN(v) && !isNaN(i)){ r=v/i; rEl.value=isFinite(r)?r.toFixed(4):''; }
  else if(changed!=='i' && !isNaN(v) && !isNaN(r)){ i=v/r; iEl.value=isFinite(i)?i.toFixed(4):''; }
  else if(changed!=='v' && !isNaN(i) && !isNaN(r)){ v=i*r; vEl.value=isFinite(v)?v.toFixed(4):''; }
  if(!isNaN(v)&&!isNaN(i)){ out.textContent = `V=${v} · I=${i} · R=${(v/i).toFixed(4)} · P=${(v*i).toFixed(4)} W`; }
  else out.textContent='Enter any two values.';
}
function calcTri(){
  const a=parseFloat(document.getElementById('tri_a').value)||0;
  const b=parseFloat(document.getElementById('tri_b').value)||0;
  const c=Math.sqrt(a*a+b*b);
  const angleA=(Math.atan2(a,b)*180/Math.PI).toFixed(2);
  const angleB=(90-angleA).toFixed(2);
  document.getElementById('tri_result').textContent = `Hypotenuse: ${c.toFixed(4)} · ∠A: ${angleA}° · ∠B: ${angleB}°`;
}
function calcBeam(){
  const P=parseFloat(document.getElementById('beam_p').value)||0;
  const L=parseFloat(document.getElementById('beam_l').value)||0;
  const EI=parseFloat(document.getElementById('beam_ei').value)||1;
  const Mmax = P*L/4;
  const Vmax = P/2;
  const delta = (P*Math.pow(L,3))/(48*EI);
  document.getElementById('beam_result').innerHTML =
    `M_max: ${Mmax.toFixed(2)} N·m &nbsp;·&nbsp; V_max: ${Vmax.toFixed(2)} N &nbsp;·&nbsp; δ_max: ${delta.toFixed(6)} m`;
}
function calcCantilever(){
  const P=parseFloat(document.getElementById('cant_p').value)||0;
  const L=parseFloat(document.getElementById('cant_l').value)||0;
  const EI=parseFloat(document.getElementById('cant_ei').value)||1;
  const Mmax = P*L;
  const Vmax = P;
  const delta = (P*Math.pow(L,3))/(3*EI);
  document.getElementById('cant_result').innerHTML =
    `M_max: ${Mmax.toFixed(2)} N·m &nbsp;·&nbsp; V_max: ${Vmax.toFixed(2)} N &nbsp;·&nbsp; δ_max: ${delta.toFixed(6)} m`;
}

function pageFormulas(query){
  if(state.activeFormula){
    const f = state.formulas.find(x=>x.id===state.activeFormula);
    if(!f){ state.activeFormula=null; }
    else return pageFormulaDetail(f);
  }
  const q=(query||'').toLowerCase();
  const cats=[...new Set(state.formulas.map(f=>f.category))];
  const filtered = q ? state.formulas.filter(f=>f.name.toLowerCase().includes(q)||f.formula.toLowerCase().includes(q)) : state.formulas;
  return `
  <h1 class="page-title">Formula Library</h1>
  <p class="page-sub">Quick reference, searchable. Click any formula for worked examples.</p>
  <div class="panel">
    <div class="panel-title">Add Formula</div>
    <div class="row">
      <input id="newFCat" placeholder="Category" style="flex:1;">
      <input id="newFName" placeholder="Name" style="flex:1;">
      <input id="newFFormula" placeholder="Formula" style="flex:2;">
      <button class="btn" onclick="addFormula()">Add</button>
    </div>
  </div>
  ${cats.map(c=>{
    const items=filtered.filter(f=>f.category===c);
    if(!items.length) return '';
    return `<div class="panel">
      <div class="panel-title">${c}</div>
      ${items.map(f=>`
        <div class="list-item" style="cursor:pointer" onclick="state.activeFormula=${f.id};render()">
          <div>${f.name}<div class="muted" style="font-family:'JetBrains Mono';">${f.formula}</div></div>
          <button class="x-btn" onclick="event.stopPropagation();removeItem('formulas',${f.id})">✕</button>
        </div>`).join('')}
    </div>`;
  }).join('') || '<p class="muted">No matches.</p>'}`;
}
function pageFormulaDetail(f){
  const examples = f.examples || [];
  return `
  <h1 class="page-title">${f.name}</h1>
  <p class="page-sub">${f.category}</p>
  <div class="panel">
    <div class="panel-title">Formula</div>
    <div class="calc-result" style="font-family:'JetBrains Mono';">${f.formula}</div>
  </div>
  <div class="panel">
    <div class="panel-title">Worked Examples</div>
    ${examples.length ? examples.map((ex,i)=>`
      <div class="list-item">
        <div><span class="tag cyan" style="margin-right:8px;">${i+1}</span>${ex}</div>
        <button class="x-btn" onclick="removeExample(${f.id},${i})">✕</button>
      </div>`).join('') : '<p class="muted">No examples yet — add one below.</p>'}
    <div class="row" style="margin-top:12px;">
      <input id="newExample" placeholder="Add your own worked example..." style="flex:1;">
      <button class="btn" onclick="addExample(${f.id})">Add</button>
    </div>
  </div>
  <button class="btn secondary" onclick="state.activeFormula=null;render()">Back to Library</button>`;
}
function addExample(id){
  const val=document.getElementById('newExample').value.trim();
  if(!val) return;
  const f=state.formulas.find(x=>x.id===id);
  if(!f.examples) f.examples=[];
  f.examples.push(val);
  render();
}
function removeExample(id,idx){
  const f=state.formulas.find(x=>x.id===id);
  f.examples.splice(idx,1);
  render();
}
function addFormula(){
  const category=document.getElementById('newFCat').value.trim()||'General';
  const name=document.getElementById('newFName').value.trim();
  const formula=document.getElementById('newFFormula').value.trim();
  if(!name||!formula) return;
  state.formulas.push({id:uid('formulas'),category,name,formula,examples:[]});
  render();
}

function pageFiles(){
  return `
  <h1 class="page-title">Project Files</h1>
  <p class="page-sub">Index of project deliverables.</p>
  <div class="panel">
    <div class="panel-title">Add File Entry</div>
    <div class="row">
      <input id="newFileName" placeholder="filename.ext" style="flex:2;">
      <input id="newFileProject" placeholder="Project name" style="flex:2;">
      <button class="btn" onclick="addFile()">Add</button>
    </div>
  </div>
  <div class="panel">
    ${state.files.map(f=>`
      <div class="list-item">
        <div>🗂 ${f.name}<div class="muted">${f.project} · ${f.date}</div></div>
        <button class="x-btn" onclick="removeItem('files',${f.id})">✕</button>
      </div>`).join('') || '<p class="muted">No files indexed yet.</p>'}
  </div>`;
}
function addFile(){
  const name=document.getElementById('newFileName').value.trim();
  const project=document.getElementById('newFileProject').value.trim()||'Untitled';
  if(!name) return;
  state.files.push({id:uid('files'),name,project,date:new Date().toISOString().slice(0,10)});
  render();
}

function pageBookmarks(){
  return `
  <h1 class="page-title">Bookmarks / Resources</h1>
  <p class="page-sub">Links worth keeping.</p>
  <div class="panel">
    <div class="panel-title">Add Bookmark</div>
    <div class="row">
      <input id="newBmTitle" placeholder="Title" style="flex:1;">
      <input id="newBmUrl" placeholder="https://..." style="flex:2;">
      <input id="newBmTag" placeholder="tag" style="flex:1;">
      <button class="btn" onclick="addBookmark()">Add</button>
    </div>
  </div>
  <div class="panel">
    ${state.bookmarks.map(b=>`
      <div class="list-item">
        <div><a href="${b.url}" target="_blank">${b.title}</a><div class="muted">${b.url}</div></div>
        <div class="row" style="align-items:center;">
          <span class="tag amber">${b.tag}</span>
          <button class="x-btn" onclick="removeItem('bookmarks',${b.id})">✕</button>
        </div>
      </div>`).join('') || '<p class="muted">No bookmarks yet.</p>'}
  </div>`;
}
function addBookmark(){
  const title=document.getElementById('newBmTitle').value.trim();
  const url=document.getElementById('newBmUrl').value.trim();
  const tag=document.getElementById('newBmTag').value.trim()||'general';
  if(!title||!url) return;
  state.bookmarks.push({id:uid('bookmarks'),title,url,tag});
  render();
}

function pageMemories(){
  return `
  <h1 class="page-title">Memories 🖼</h1>
  <p class="page-sub">Little snapshots worth keeping — photos, screenshots, whatever matters to you.</p>
  <div class="panel">
    <div class="panel-title">Add a Memory</div>
    <div class="upload-drop" onclick="document.getElementById('memFileInput').click()">
      📷 Click to choose a picture
      <input type="file" id="memFileInput" accept="image/*" class="hidden" onchange="handleMemoryFile(event)">
    </div>
    <div class="field" style="margin-top:12px;">
      <label>Caption</label>
      <input id="memCaption" placeholder="What's this memory about?">
    </div>
    <div id="memPreviewWrap"></div>
  </div>
  <div class="memory-grid">
    ${state.memories.slice().reverse().map(m=>`
      <div class="memory-card">
        <button class="x-btn" onclick="removeMemory('${m.id}')">✕</button>
        <img src="${m.img}">
        <div class="cap">${m.caption||'Untitled'}<div class="muted">${m.date}</div></div>
      </div>`).join('') || '<p class="muted">No memories saved yet — add your first one above.</p>'}
  </div>`;
}
let pendingMemoryImg=null;
function handleMemoryFile(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    pendingMemoryImg=reader.result;
    document.getElementById('memPreviewWrap').innerHTML =
      `<div style="margin-top:12px;"><img src="${pendingMemoryImg}" style="max-width:160px;border-radius:var(--radius);"></div>
       <button class="btn" style="margin-top:10px;" onclick="saveMemory()">Save Memory</button>`;
  };
  reader.readAsDataURL(file);
}
async function saveMemory(){
  if(!pendingMemoryImg) return;
  const caption=document.getElementById('memCaption').value.trim();
  const item={id:'m'+Date.now(), caption, date:new Date().toISOString().slice(0,10), img:pendingMemoryImg};
  state.memories.push(item);
  try{ await window.storage.set('memory:'+item.id, JSON.stringify(item), false); }catch(e){}
  await saveMemoryIndex();
  pendingMemoryImg=null;
  render();
}
async function removeMemory(id){
  state.memories = state.memories.filter(m=>m.id!==id);
  try{ await window.storage.delete('memory:'+id, false); }catch(e){}
  await saveMemoryIndex();
  render();
}

function removeItem(key,id){
  state[key]=state[key].filter(x=>x.id!==id);
  render();
}

// ---------- GLOBAL SEARCH ----------
function globalSearch(q){
  q=q.toLowerCase();
  if(!q) return null;
  const results=[];
  state.subjects.forEach(s=>{ if(s.name.toLowerCase().includes(q)) results.push({type:'Subject',label:s.name,go:()=>go('subjects')}); });
  state.notes.forEach(n=>{ if(n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)) results.push({type:'Note',label:n.title,go:()=>{state.activeNote=n.id;go('notes');}}); });
  state.formulas.forEach(f=>{ if(f.name.toLowerCase().includes(q)||f.formula.toLowerCase().includes(q)) results.push({type:'Formula',label:f.name,go:()=>go('formulas')}); });
  state.bookmarks.forEach(b=>{ if(b.title.toLowerCase().includes(q)) results.push({type:'Bookmark',label:b.title,go:()=>go('bookmarks')}); });
  state.assignments.forEach(a=>{ if(a.title.toLowerCase().includes(q)) results.push({type:'Task',label:a.title,go:()=>go('tracker')}); });
  return results;
}

// ---------- PERSISTENCE ----------
let saveTimer=null;
function showToast(){
  const t=document.getElementById('saveToast');
  t.classList.add('show');
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('show'),1200);
}
async function persistState(){
  try{
    const {memories, activeNote, ...rest} = state;
    await window.storage.set('workshop-state', JSON.stringify(rest), false);
    showToast();
  }catch(e){ console.error('save failed',e); }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(persistState, 500);
}
async function loadState(){
  try{
    const res = await window.storage.get('workshop-state', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      Object.assign(state, saved);
    }
  }catch(e){ /* no saved state yet, that's fine */ }
  try{
    const idx = await window.storage.get('memory-ids', false);
    const ids = idx && idx.value ? JSON.parse(idx.value) : [];
    const items = [];
    for(const id of ids){
      try{
        const r = await window.storage.get('memory:'+id, false);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    state.memories = items;
  }catch(e){ state.memories = state.memories||[]; }
}
async function saveMemoryIndex(){
  const ids = state.memories.map(m=>m.id);
  try{ await window.storage.set('memory-ids', JSON.stringify(ids), false); }catch(e){}
}

// ---------- RENDER ----------
function render(){
  renderNav();
  const v=document.getElementById('view');
  switch(state.page){
    case 'dashboard': v.innerHTML=pageDashboard(); break;
    case 'subjects': v.innerHTML=pageSubjects(); break;
    case 'notes': v.innerHTML=pageNotes(); break;
    case 'pdfs': v.innerHTML=pagePdfs(); break;
    case 'tracker': v.innerHTML=pageTracker(); break;
    case 'gpa': v.innerHTML=pageGpa(); break;
    case 'calc': v.innerHTML=pageCalc(); fillMFPSelects(); calcUnit(); calcMFP(); calcAV(); calcCircle(); calcOhm(); calcTri(); calcBeam(); calcCantilever(); break;
    case 'formulas': v.innerHTML=pageFormulas(); break;
    case 'files': v.innerHTML=pageFiles(); break;
    case 'bookmarks': v.innerHTML=pageBookmarks(); break;
    case 'memories': v.innerHTML=pageMemories(); break;
    case 'search': v.innerHTML=renderSearchResults(); break;
  }
  queueSave();
}
function renderSearchResults(){
  const q=document.getElementById('globalSearch')?document.getElementById('globalSearch').value:'';
  const results=globalSearch(q)||[];
  window.__searchResults = results;
  return `
  <h1 class="page-title">Search Results</h1>
  <p class="page-sub">"${q}" — ${results.length} match(es)</p>
  <div class="panel">
    ${results.map((r,i)=>`
      <div class="list-item" style="cursor:pointer" onclick="window.__searchResults[${i}].go()">
        <div>${r.label}</div><span class="tag cyan">${r.type}</span>
      </div>`).join('') || '<p class="muted">No matches.</p>'}
  </div>`;
}

document.getElementById('globalSearch').addEventListener('input',e=>{
  if(e.target.value.trim()){ state.page='search'; }
  else if(state.page==='search'){ state.page='dashboard'; }
  render();
  document.getElementById('globalSearch').value=e.target.value;
  document.getElementById('globalSearch').focus();
});

document.getElementById('themeToggle').addEventListener('click',()=>{
  const b=document.body;
  b.dataset.theme = b.dataset.theme==='dark' ? 'light' : 'dark';
});

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);

(async function boot(){
  document.getElementById('view').innerHTML = '<p class="muted">Loading your workspace...</p>';
  await loadState();
  render();
})();
</script>
